name: 測試
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安裝測試依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ibus-rime librime-plugin-lua librime-bin rime-prelude python3-yaml python3-gi gsettings-desktop-schemas lua5.4 librime-dev g++
      - name: 驗證字庫、安裝流程及輸入操作
        run: ./tools/test.sh
      - name: 打包
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-xp-quick
          path: dist/*
